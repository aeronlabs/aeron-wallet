# Releases come from a tag, built here, never from a laptop. npm mints a
# short-lived OIDC token for this workflow, so no npm token exists to leak,
# and it attaches a provenance attestation: proof that the tarball on npm was
# built from this commit, in this repo, by this workflow.
#
# One-time setup on npmjs.com: package settings -> Trusted Publisher ->
# GitHub Actions, repo aeronlabs/aeron-wallet, workflow publish.yml.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # No registry-url on purpose. Setting it makes setup-node write an
      # .npmrc containing `_authToken=${NODE_AUTH_TOKEN}`, and with no token
      # secret configured that expands to the literal placeholder
      # XXXXX-XXXXX-XXXXX-XXXXX. npm then authenticates with that garbage
      # instead of exchanging its OIDC identity, and the registry answers 404
      # — which reads exactly like a missing trusted publisher and is not.
      # registry.npmjs.org is the default anyway.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      # prepublishOnly runs typecheck, tests, and build again at publish time.
      - run: npm publish
